<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شات اليمن Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/chat.css">

</head>


<body>


<div class="chat-app">


<!-- الشريط العلوي -->

<header class="top-bar">


<button class="icon">
☰
</button>


<div class="room-title">

💬 الغرفة العامة

<span>
🟢 متصل
</span>

</div>


<button class="icon">
👥
</button>


</header>



<!-- قائمة جانبية -->

<aside class="users-panel">


<h3>
المتواجدون
</h3>


<div class="user">

<img src="https://i.pravatar.cc/40">

<span>
أحمد 🟢
</span>

</div>



<div class="user">

<img src="https://i.pravatar.cc/41">

<span>
محمد 🟢
</span>

</div>


</aside>




<!-- الرسائل -->

<main class="messages">


<div class="system">
أهلاً بك في شات اليمن Pro
</div>



<div class="message other">


<img src="https://i.pravatar.cc/42">


<div>

<b>
أحمد
</b>

<p>
مرحبا بالجميع 👋
</p>

<time>
10:30
</time>

</div>


</div>





<div class="message mine">


<div>

<b>
أنت
</b>

<p>
أهلاً وسهلاً
</p>

<time>
10:31
</time>


</div>


</div>



</main>




<!-- الكتابة -->

<div class="write-area">


<button>
➕
</button>


<input 
type="text"
placeholder="اكتب رسالتك...">



<button>
😀
</button>



<button class="send">
➤
</button>


</div>




<!-- الشريط السفلي -->

<footer class="bottom-bar">


<button>
🔊
</button>


<button>
📻
</button>


<div>
🌎 العامة
</div>


<button>
⚙️
</button>


<button>
👤
</button>


</footer>



</div>



</body>

</html>
<script src="/socket.io/socket.io.js"></script>
<script src="js/chat.js"></script>
