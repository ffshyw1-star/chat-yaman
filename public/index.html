<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شات اليمن Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="app">

<header class="header">

<div class="logo">
💬 شات اليمن Pro
</div>

<p>
دردشة عربية مجانية وسريعة
</p>

</header>


<section class="login-box">


<h2>
دخول الدردشة
</h2>


<div class="input-group">

<input 
id="username"
type="text"
placeholder="اكتب اسم المستخدم">

</div>


<div class="input-group">

<select id="gender">

<option value="">
اختر الجنس
</option>

<option>
ذكر 🔵
</option>

<option>
أنثى 🌸
</option>

<option>
آخر ⚪
</option>

</select>

</div>


<div class="input-group">

<input 
id="age"
type="number"
placeholder="العمر">

</div>



<button onclick="enterChat()">

دخول كزائر 🚀

</button>


<button class="member">

تسجيل دخول عضو

</button>


</section>


<footer>

© 2026 Chat Yemen Pro

</footer>


</div>


<script src="js/main.js"></script>

</body>
</html>
